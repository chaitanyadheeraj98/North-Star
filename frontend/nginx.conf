server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a rebuilt bundle would be invisible
    # behind a stale document referencing deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Same-origin proxy to the backend container. Analysis waits on a real model
    # call through Pi, so the read timeout is generous.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # A spec or plan file may be up to 5,000,000 characters (DOCUMENT_MAX_CHARS
        # in backend/app/schemas/api.py); as JSON-escaped UTF-8 that can exceed
        # nginx's 1 MB default by far. Anything larger is rejected here with 413.
        client_max_body_size 25m;
    }
}
